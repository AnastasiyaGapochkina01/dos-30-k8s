workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /.*build/'
      when: always
    - when: never

stages:
  - lint
  - build

variables:
  REPO: anestesia01/counter
  REPO_USER: anestesia01
  TAG: ${CI_COMMIT_SHORT_SHA}
  REGISTRY: https://index.docker.io/v1/

linter:job:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install pylint
  script:
    - pylint ./backend/app
  allow_failure: true
  tags:
    - runner

build:job:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"$REGISTRY\":{\"username\":\"$REPO_USER\",\"password\":\"$TOKEN\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context=$CI_PROJECT_DIR/${PART} --dockerfile=$CI_PROJECT_DIR/${PART}/Dockerfile --destination=${REPO}:${PART}-${TAG}
  parallel:
    matrix:
      - PART: ['backend', 'frontend']
  tags:
    - runner
