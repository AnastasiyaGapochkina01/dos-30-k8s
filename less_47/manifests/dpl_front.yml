apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-frontend
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      part: frontend
  template:
    metadata:
      labels:
        part: frontend
    spec:
      containers:
        - name: frontend
          image: anestesia01/counter:frontend-ae90d3de
          ports:
            - containerPort: 80
          
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: app
spec:
  selector:
    part: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP  