apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      part: backend
  template:
    metadata:
      labels:
        part: backend
    spec:
      containers:
        - name: backend
          image: anestesia01/counter:backend-cb7a6192
          ports:
            - containerPort: 8000
          env:
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: MYSQL_DATABASE
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: MYSQL_PASSWORD
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: MYSQL_USER
          - name: DB_HOST
            value: "db-svc"
          - name: DB_PORT
            value: "3306"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: app
spec:
  selector:
    part: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP  