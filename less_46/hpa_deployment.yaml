apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-minikube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-minikube
  template:
    metadata:
      labels:
        app: hello-minikube
    spec:
      containers:
      - name: hello-minikube
        image: laly9999/coming-soon-website:2
        resources:
          requests:
            cpu: "100m"   
            memory: "128Mi"   
          limits:
            cpu: "500m"  
            memory: "256Mi"   
