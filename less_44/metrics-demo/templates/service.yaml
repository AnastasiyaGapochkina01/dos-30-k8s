---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.db.service }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    part: db
  ports:
  - port: {{ .Values.db.port | default "5432" }}
    targetPort: {{ .Values.db.port | default "5432" }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.service }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    part: db
  ports:
  - port: {{ .Values.api.port | default "5000" }}
    targetPort: {{ .Values.api.port | default "5000" }}